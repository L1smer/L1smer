name: Update README cards

# Generates the profile stat cards as static SVG files and commits them to this
# repo (profile/*.svg). The README only shows those committed files, so nothing
# is fetched when someone opens the profile.

on:
  schedule:
    - cron: "17 6 * * *" # daily
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    # Regenerate right away when this file changes.
    paths:
      - .github/workflows/readme-cards.yml

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: false

env:
  # Shared palette for all cards. Change it once here.
  THEME: "theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=1F6FEB&text_color=C9D1D9"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Uses the built-in token. Optional: add a CARDS_TOKEN secret (a personal
          # access token) to have the card commits pushed from your own account.
          token: ${{ secrets.CARDS_TOKEN || github.token }}

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_rank=true&hide=stars,contribs&${{ env.THEME }}"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&${{ env.THEME }}"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@51cfb8879073b4c016ce6286016de0b14d179077 # v1.7.0
        with:
          options: "user=${{ github.repository_owner }}&hide_border=true&disable_animations=true&background=0D1117&stroke=30363D&ring=58A6FF&fire=FF6B6B&currStreakNum=C9D1D9&sideNums=C9D1D9&currStreakLabel=58A6FF&sideLabels=58A6FF&dates=8B949E"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile/
          git diff --staged --quiet && echo "No card changes." && exit 0
          git commit -m "chore: refresh README stat cards"
          git push
