<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Hey, I'm Maksym aka L1smer. Full-Stack Developer, Startup Builder, ML/AI Learner">
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6E00"/>
      <stop offset="55%" stop-color="#ED6402"/>
      <stop offset="100%" stop-color="#843D0B"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8A1F"/>
      <stop offset="100%" stop-color="#ED6402"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6E00" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF6E00"/>
      <stop offset="100%" stop-color="#FF6E00" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.5" r="0.45">
      <stop offset="0%" stop-color="#FF6E00" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF6E00" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="900" height="220" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">

  <!-- Background -->
  <rect width="900" height="220" rx="16" fill="#151515"/>
  <rect width="900" height="220" rx="16" fill="url(#glow)"/>

  <!-- Faded roof lines in the background, right side -->
  <g fill="none" stroke="#FF6E00" stroke-width="2" stroke-linejoin="round" opacity="0.07">
    <path d="M700 230 V120 L800 50 L900 120 V230"/>
    <path d="M730 230 V135 L800 85 L870 135 V230"/>
    <path d="M760 230 V150 L800 120 L840 150 V230"/>
  </g>

  <!-- Nested roof mark, in the style of the Aimpiria logo -->
  <g fill="none" stroke="url(#orange)" stroke-linejoin="round" stroke-linecap="round" transform="translate(60 42)">
    <path d="M0 136 V58 L68 8 L136 58 V136" stroke-width="10"/>
    <path d="M24 136 V70 L68 38 L112 70 V136" stroke-width="10" opacity="0.8"/>
    <path d="M48 136 V82 L68 68 L88 82 V136" stroke-width="10" opacity="0.6"/>
  </g>

  <!-- Text -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="240" y="92" font-size="44" font-weight="700" fill="#F0F6FC">Hey, I'm Maksym</text>
    <text x="240" y="140" font-size="34" font-weight="700" fill="#8B949E">aka <tspan fill="url(#text)">L1smer</tspan></text>
    <text x="240" y="178" font-size="17" font-weight="600" fill="#C9D1D9" letter-spacing="0.5">Full-Stack Developer  <tspan fill="#FF6E00">·</tspan>  Startup Builder  <tspan fill="#FF6E00">·</tspan>  ML/AI Learner</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="40" y="206" width="820" height="2" fill="url(#line)"/>
  </g>
</svg>
